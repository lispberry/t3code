name: Fork release

# Fork-only workflow (lispberry/t3code). Builds the macOS arm64 desktop app and
# the `t3` CLI, publishes them as a GitHub Release tagged lb-v<version>, and
# bumps the cask and formula in lispberry/homebrew-tap.
#
# Versions use upstream's preview format (<base>-preview.<date>.<run>): the
# desktop build then ships without an update feed, so the app never replaces
# itself with an official build. Homebrew is the only updater.
#
# Packaging reuses upstream's release-desktop.yml, so changes to it arrive with
# the daily upstream sync.

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

env:
  TAP_REPO: lispberry/homebrew-tap
  CASK_NAME: t3code
  FORMULA_NAME: t3-lispberry
  KEEP_RELEASES: 10

jobs:
  bundle:
    name: Build JS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Resolve version
        id: version
        run: |
          node scripts/resolve-nightly-release.ts \
            --channel preview \
            --date "$(date -u +%Y%m%d)" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --sha "$GITHUB_SHA" \
            --github-output

      - name: Align package versions and public configuration
        run: |
          node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"
          # Public T3 Connect identifiers (Clerk publishable key, relay URL).
          cp .env.example .env

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  config:
    name: Read public configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clerk_publishable_key: ${{ steps.env.outputs.T3CODE_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ steps.env.outputs.T3CODE_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ steps.env.outputs.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ steps.env.outputs.T3CODE_RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .env.example
          sparse-checkout-cone-mode: false
      - id: env
        run: grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example >> "$GITHUB_OUTPUT"

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [bundle, config]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.config.outputs.relay_url }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true

  publish:
    name: Publish release and bump tap
    needs: [bundle, desktop_mac_arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.bundle.outputs.version }}
      SHORT_SHA: ${{ needs.bundle.outputs.short_sha }}
    steps:
      - name: Download desktop build
        uses: actions/download-artifact@v8
        with:
          name: desktop-mac-arm64
          path: release

      - name: Download CLI archive
        uses: actions/download-artifact@v8
        with:
          name: cli-mac-arm64
          path: release

      - name: Collect assets
        id: assets
        run: |
          set -euo pipefail
          cd release
          ls -la
          dmg="$(ls -1 *.dmg | head -n1)"
          cli="$(ls -1 t3-*-darwin-arm64.tar.gz | head -n1)"
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          {
            echo "dmg_sha=$(sha256sum "$dmg" | cut -d' ' -f1)"
            echo "cli_sha=$(sha256sum "$cli" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          tag="lb-v${VERSION}"
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code (lispberry) ${VERSION} (${SHORT_SHA})" \
            --notes "Personal build of ${GITHUB_SHA} for macOS arm64. Install: \`brew install --cask ${TAP_REPO%%/*}/tap/${CASK_NAME}\` and \`brew install ${TAP_REPO%%/*}/tap/${FORMULA_NAME}\`." \
            --latest

      - name: Prune old releases
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"lb-v\"))] | sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" |
            while read -r tag; do
              echo "Deleting old release ${tag}"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done

      - name: Bump Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          DMG_SHA: ${{ steps.assets.outputs.dmg_sha }}
          CLI_SHA: ${{ steps.assets.outputs.cli_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::SYNC_TOKEN is not set; cannot dispatch ${TAP_REPO} bump.yml. The release was published."
            exit 1
          fi
          # The dispatch API sometimes answers 5xx after accepting the event.
          # bump.yml is idempotent (no commit when nothing changes), so retry.
          dispatch() {
            for attempt in 1 2 3 4; do
              gh workflow run bump.yml --repo "$TAP_REPO" "$@" && return 0
              echo "::warning::Dispatch failed (attempt ${attempt}); retrying."
              sleep $((attempt * 10))
            done
            return 1
          }
          dispatch -f kind=cask -f name="$CASK_NAME" -f version="$VERSION" -f sha256="$DMG_SHA"
          # The tap serializes bumps; give the first one a head start.
          sleep 15
          dispatch -f kind=formula -f name="$FORMULA_NAME" -f version="$VERSION" -f sha256="$CLI_SHA"
